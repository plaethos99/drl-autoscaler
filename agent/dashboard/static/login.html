<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · DRL Autoscaler demo</title>
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #1c2430; --muted: #5d6b7c; --line: #e3e7ec; --accent: #2f6fde; --bad: #d64545; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161c; --card: #1a2029; --text: #e6ebf1; --muted: #93a1b3; --line: #2b3440; --accent: #6a9cf5; --bad: #f07070; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 26px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { width: 100%; margin-top: 20px; padding: 10px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .err { display: none; margin-top: 14px; color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>DRL Autoscaler · live demo</h1>
    <p>Deep-RL control of a cloud service's CPU allocation on AWS. Sign in to start a demo run.</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" value="examiner" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
    <div class="err" id="err" role="alert">Wrong username or password.</div>
  </form>
<script>
  if (new URLSearchParams(location.search).has("error")) document.getElementById("err").style.display = "block";
</script>
</body>
</html>
