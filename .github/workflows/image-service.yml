# Tests the image service and publishes its Docker image to GHCR (runs on GitHub, not your PC).
name: image-service

on:
  push:
    branches: [main]
    paths: ["apps/image-service/**", ".github/workflows/image-service.yml"]
  pull_request:
    paths: ["apps/image-service/**", ".github/workflows/image-service.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/image-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: apps/image-service/requirements*.txt }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner for GHCR
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: apps/image-service
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/image-service:latest
            ghcr.io/${{ env.OWNER }}/image-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
