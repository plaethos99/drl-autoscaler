# Unit tests for the controller (runs on GitHub, not your PC). No PyTorch, Docker or Prometheus needed.
name: agent

on:
  push:
    branches: [main]
    paths: ["agent/**", "loadgen/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", "loadgen/**", ".github/workflows/agent.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy requests pytest flask
      - run: python -m pytest -q
      - run: bash -n scripts/ec2-setup.sh && bash -n scripts/run_test.sh && bash -n scripts/run_all.sh && bash -n scripts/install-dashboard.sh && bash -n scripts/loadgen-setup.sh
