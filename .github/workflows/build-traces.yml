# Builds the real-traffic windows from the Azure Functions Invocation Trace 2021 (CC-BY 4.0) and commits
# them to the repo. Run by hand (Actions -> build-traces -> Run workflow, or `gh workflow run build-traces.yml`).
name: build-traces

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Download the trace (Azure Public Dataset)
        run: |
          curl -fL --retry 3 -o trace.rar \
            https://github.com/Azure/AzurePublicDataset/raw/master/data/AzureFunctionsInvocationTraceForTwoWeeksJan2021.rar
          ls -la trace.rar
      - name: Extract
        run: |
          # RAR5: unrar (multiverse) handles it; unar could not ("read more data than was available").
          sudo apt-get update -qq
          mkdir -p trace
          if sudo apt-get install -y -qq unrar; then
            unrar x -o+ trace.rar trace/
          else
            sudo apt-get install -y -qq 7zip-rar 7zip && 7zz x -otrace trace.rar
          fi
          find trace -type f -exec ls -la {} \;
      - run: pip install numpy pandas
      - run: python training/build_trace_windows.py trace
      - name: Commit the windows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/data/azure2021_windows.csv.gz loadgen/traces.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Add Azure Functions 2021 trace windows (built by build-traces.yml)"
          git push
